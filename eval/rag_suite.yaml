- id: default-arg-shared
  tags:
  - answerable
  - functions
  vars:
    question: I used an empty list as a default parameter and items keep piling up between calls. Why?
  expected: The default value is evaluated only once, when the function is defined, so a mutable default like a list is shared
    between calls. Use None as the default and create a new list inside the function.

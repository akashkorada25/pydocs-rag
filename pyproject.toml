[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydocs-rag"
version = "0.1.0"
description = "Ask the Python docs: a retrieval-augmented assistant with citations, measured with EvalForge."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (code); PSF License (Python documentation in data/ and ragassist/data/)"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
dense = ["fastembed>=0.4"]
eval = ["evalforge @ git+https://github.com/akashkorada25/evalforge@c845575adc4884ec168fc1efe0884b1debaef140"]
dev = ["pytest>=7"]

[project.scripts]
pydocs-rag = "ragassist.cli:main"

[tool.setuptools]
packages = ["ragassist"]

[tool.setuptools.package-data]
ragassist = ["data/*.jsonl", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
